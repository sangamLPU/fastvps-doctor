name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development tools
        run: python -m pip install '.[dev]'
      - name: Run unit tests
        run: python -m pytest -m "not integration"
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Type check
        run: python -m mypy src/fastvps_doctor

  linux-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build disposable Ubuntu integration image
        run: docker build -f tests/integration/Dockerfile -t fastvps-doctor-integration .
      - name: Run Linux integration checks as an unprivileged user
        run: docker run --rm fastvps-doctor-integration

