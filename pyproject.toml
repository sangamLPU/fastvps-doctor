[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "fastvps-doctor"
version = "0.1.0"
description = "Offline-first Linux diagnostics and privacy-conscious support reports for VPS customers."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "FastVPS Doctor contributors" }]
keywords = ["linux", "diagnostics", "vps", "support", "privacy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "psutil>=6.1,<8",
  "pydantic>=2.9,<3",
  "rich>=13.9,<15",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
  "types-psutil>=6.1,<8",
]

[project.scripts]
fastvps-doctor = "fastvps_doctor.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/fastvps_doctor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: opt-in tests against a disposable Linux host/container"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["fastvps_doctor"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

